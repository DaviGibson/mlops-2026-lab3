name: CD - Build e Deploy no Azure

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag da versão para deploy/rollback (ex: v1.0.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Extrair versão da tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/davigibson/mlops-2026-lab3:${{ env.VERSION }}
            ghcr.io/davigibson/mlops-2026-lab3:latest

  deploy:
    needs: [ci, release]
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.ci.result == 'success' && needs.release.result == 'success'))
    runs-on: ubuntu-latest
    environment: production
    outputs:
      url: ${{ steps.get_url.outputs.url }}
    steps:
      - name: Definir versão alvo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Login no Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Atualizar Container App no Azure
        run: |
          az containerapp update \
            --name intent-clf \
            --resource-group mlops-2026-2 \
            --image "ghcr.io/davigibson/mlops-2026-lab3:${{ env.VERSION }}" \
            --set-env-vars "APP_VERSION=${{ env.VERSION }}"

      - name: Obter URL do Container App
        id: get_url
        run: |
          FQDN=$(az containerapp show \
            --name intent-clf \
            --resource-group mlops-2026-2 \
            --query "properties.configuration.ingress.fqdn" \
            -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

  verify:
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Definir versão alvo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          fi

      - name: Verificar versão no ar
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          echo "Verificando ${URL} para versão ${VERSION}..."
          for i in $(seq 1 30); do
            RESP=$(curl -sS "${URL}/" || true)
            echo "Tentativa $i: $RESP"
            if echo "$RESP" | grep -q "\"version\":\"${VERSION}\"" || echo "$RESP" | grep -q "\"version\": \"${VERSION}\""; then
              echo "OK: ${VERSION} no ar"
              exit 0
            fi
            sleep 10
          done
          echo "Erro: versão ${VERSION} não respondeu no tempo esperado."
          exit 1
